name: Repository compliance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.64.0
      - name: Initialize TFLint
        run: tflint --init
      - name: Lint Terraform
        run: tflint --recursive --format compact
      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
          TERRAFORM_DOCS_VERSION: 0.24.0
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          echo "${TERRAFORM_DOCS_SHA256}  /tmp/terraform-docs.tar.gz" | sha256sum --check
          sudo tar --extract --gzip --file /tmp/terraform-docs.tar.gz --directory /usr/local/bin terraform-docs
      - name: Regenerate Terraform documentation
        shell: pwsh
        run: ./scripts/Update-TerraformDocs.ps1
      - name: Check generated documentation drift
        run: git diff --exit-code
      - name: Check repository policy
        shell: pwsh
        run: ./scripts/Test-RepositoryPolicy.ps1
