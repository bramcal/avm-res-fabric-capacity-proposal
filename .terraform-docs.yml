formatter: markdown table

header-from: main.tf
footer-from: _footer.md
recursive:
  enabled: false
settings:
  anchor: true
  color: false
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  read-comments: true
  required: true
  sensitive: true
  type: true
output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->